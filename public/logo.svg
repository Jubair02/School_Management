<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EduSphere">
  <title>EduSphere</title>
  <defs>
    <linearGradient id="es-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#es-tile)"/>

  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe: outline, equator, meridian -->
    <circle cx="32" cy="38" r="14"/>
    <path d="M18 38h28"/>
    <path d="M32 24c4 3.8 6.2 8.7 6.2 14S36 48.2 32 52c-4-3.8-6.2-8.7-6.2-14S28 27.8 32 24z"/>
    <!-- Mortarboard -->
    <path d="M32 11 52 19.5 32 28 12 19.5z" fill="#ffffff"/>
    <!-- Tassel -->
    <path d="M47.2 21.5v6.7"/>
  </g>
  <circle cx="47.2" cy="30" r="2.1" fill="#ffffff"/>
</svg>
